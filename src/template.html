<meta charset="utf-8">
<title>日本地形地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 寬螢幕（≥900px）＝左側欄＋右側全高地圖（側欄可收合）；中等寬度＝上方面板＋下方地圖；手機＝精簡標題列＋全幅地圖，選單在底部抽屜 */
:root {
  --bg: #e9eee8;
  --panel: #f8faf6;
  --fg: #1e2a23;
  --muted: #5c6b62;
  --line: #cfd9cf;
  --accent: #2c6a4c;
  --accent-soft: #dcebe2;
  --on-accent: #ffffff;
  --danger: #b2402f;
  --found: #1e2a23;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b17; --panel: #1c2520; --fg: #e3ebe5; --muted: #9aaba0; --line: #33433a;
    --accent: #7cc39c; --accent-soft: #24382d; --on-accent: #0f1a14; --danger: #e5826f; --found: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b17; --panel: #1c2520; --fg: #e3ebe5; --muted: #9aaba0; --line: #33433a;
  --accent: #7cc39c; --accent-soft: #24382d; --on-accent: #0f1a14; --danger: #e5826f; --found: #ffffff;
  color-scheme: dark;
}
html, body { height: 100%; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 12px; box-sizing: border-box; gap: 10px;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 16px; padding: 12px;
}
.head { display: contents; }
.panel h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .04em; text-wrap: balance; grid-column: 1; grid-row: 1; }
.panel h1 small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
#btnExport { grid-column: 3; grid-row: 1; }
.sheet { display: contents; }
.sheet-head, .m-only, .w-only { display: none; }
.search { grid-column: 2; grid-row: 1; position: relative; min-width: 0; max-width: 360px; justify-self: center; width: 100%; }
.search input {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
  padding: 6px 14px; font-size: 13px;
}
.sugg {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.18);
  display: flex; flex-direction: column; padding: 4px; max-height: 320px; overflow-y: auto;
}
.sugg button { display: flex; align-items: baseline; gap: 8px; border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 14px; }
.sugg button:hover, .sugg button[aria-selected="true"] { background: var(--accent-soft); }
.sugg small { color: var(--muted); font-size: 11px; }
.sugg .msg { padding: 8px 10px; font-size: 12px; color: var(--muted); }
.opts { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.tabs, .items-head, .items, .groups, .prefs { grid-column: 1 / -1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 11px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.lv-group { display: inline-flex; gap: 10px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; user-select: none; cursor: pointer; }
.opt input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.opt.slider input { width: 110px; height: auto; }
.opt.slider b { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 5px 12px; font-size: 13px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.btn.small { padding: 2px 9px; font-size: 12px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 11px 4px 9px; font-size: 13px; white-space: nowrap;
}
.tab .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tab .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab.has .cnt { color: var(--accent); font-weight: 700; }
.tab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }

.items-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.items { display: flex; flex-wrap: wrap; gap: 6px; max-height: 108px; overflow-y: auto; padding: 3px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px 3px 7px; font-size: 13px;
  background: transparent; user-select: none;
}
.chip .box { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--muted); flex: none; box-sizing: border-box; }
.chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.chip[aria-pressed="true"] .box { background: var(--c); border-color: var(--c); }
/* 搜尋結果提示：深色主題白框、淺色主題深色框 */
.chip.found { outline: 3px solid var(--found); outline-offset: 1px; font-weight: 700; }

.prefs { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.prefs .label { color: var(--muted); font-size: 12px; }
.pref-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 90px; overflow-y: auto; }
.pchip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.pchip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.groups { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; border-top: 1px dashed var(--line); padding-top: 10px; }
.groups .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
.group { display: inline-flex; align-items: stretch; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
.group button { border: 0; background: transparent; padding: 3px 9px; font-size: 13px; }
.group .apply:hover { background: var(--accent-soft); }
.group .del { border-left: 1px solid var(--line); color: var(--muted); padding: 3px 7px; }
.group .del:hover { color: var(--danger); }
.groups .empty { color: var(--muted); font-size: 12px; }
.groups form { display: inline-flex; gap: 6px; margin-left: auto; }
.groups input[type="text"] {
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px;
  background: var(--bg); width: 11em; min-width: 0;
}

.map-wrap {
  flex: 1; min-height: 360px; position: relative;
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #d4e6ef;
}
/* 手勢綁在不動的外框（.map-wrap）上；手勢進行中只移動 #mapLayer，避免手指座標隨圖層移動而回饋抖動 */
.map-wrap { cursor: grab; touch-action: none; }
.map-wrap:active { cursor: grabbing; }
#mapLayer { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); font-size: 16px; line-height: 1; padding: 0;
}
.zoom button.fit { font-size: 11px; }
.hint { position: absolute; left: 10px; top: 10px; max-width: calc(100% - 70px); font-size: 11px; color: #33443a; background: rgba(255,255,255,.85); padding: 3px 8px; border-radius: 4px; pointer-events: none; }
.note { position: absolute; left: 10px; bottom: 36px; max-width: calc(100% - 20px); font-size: 11px; color: #44564c; background: rgba(255,255,255,.7); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
#btnExpand { position: absolute; left: 10px; top: 10px; z-index: 5; }

/* 測驗模式 */
.quizbar {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 6;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.18); font-size: 13px; max-width: calc(100% - 110px);
}
.quizbar b { font-variant-numeric: tabular-nums; }
body.quiz .panel { pointer-events: none; opacity: .45; }
body.quiz #btnSheet, body.quiz #btnExport { pointer-events: none; opacity: .45; }
.picker {
  position: fixed; z-index: 40; width: 260px; max-height: 50vh; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.picker-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.picker-head button { border: 0; background: transparent; font-size: 18px; line-height: 1; padding: 2px 6px; }
.picker-list { overflow-y: auto; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.picker-list button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 9px; font-size: 13px; }
.picker-list button:hover { border-color: var(--accent); background: var(--accent-soft); }
.picker-list .clear { color: var(--danger); }
.picker-list .msg { font-size: 12px; color: var(--muted); padding: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 50;
}
.modal { position: fixed; inset: 0; background: rgba(10,16,12,.6); display: grid; place-items: center; z-index: 45; padding: 16px; }
.modal .box {
  background: var(--panel); border-radius: var(--radius); padding: 14px; max-width: min(960px, 100%);
  max-height: 100%; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; overflow-y: auto;
}
.modal img { max-width: 100%; max-height: 60vh; object-fit: contain; border: 1px solid var(--line); }
.modal p { margin: 0; font-size: 13px; color: var(--muted); }
.print-box { width: min(620px, 100%); }
.print-box h2 { margin: 0; font-size: 17px; }
.prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.prow.end { justify-content: flex-end; }
.pmodes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pmode { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; cursor: pointer; font-size: 13px; }
.pmode input { position: absolute; opacity: 0; pointer-events: none; }
.pmode svg { width: 100%; height: auto; color: var(--muted); background: var(--bg); border-radius: 6px; }
.pmode small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.pmode.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.pmode.off { opacity: .4; cursor: not-allowed; }
.pmode:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
#printNote { margin: 0; font-size: 12px; color: var(--muted); min-height: 1em; }
#offscreen { position: fixed; left: -100000px; top: 0; overflow: hidden; pointer-events: none; }
@media (max-width: 640px) { .pmodes { grid-template-columns: 1fr; } .pmode { display: grid; grid-template-columns: 110px 1fr; grid-template-rows: auto auto; column-gap: 10px; } .pmode svg { grid-row: 1 / 3; } }
.modal input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); font-size: 13px; }

/* 寬螢幕（≥900px）：左側欄 */
@media (min-width: 900px) {
  body { flex-direction: row; }
  .panel {
    width: 400px; flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    overflow-y: auto; padding: 14px;
  }
  .head { display: flex; align-items: flex-start; gap: 8px; }
  .panel h1 { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .panel h1 small { margin-left: 0; }
  .w-only { display: inline-flex; }
  .search { max-width: none; }
  .opts { gap: 8px 12px; }
  .tabs { flex-wrap: wrap; overflow: visible; }
  .items { max-height: none; overflow: visible; }
  .pref-list { max-height: none; overflow: visible; }
  .groups form { margin-left: 0; width: 100%; }
  .groups input[type="text"] { flex: 1; }
  .map-wrap { min-height: 0; }
  body.collapsed .panel { display: none; }
}
@media (max-width: 640px) {
  body { padding-block: 8px; gap: 8px; }
  .panel { grid-template-columns: 1fr auto auto; gap: 8px; padding: 8px 10px; }
  .panel h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .panel h1 small { display: none; }
  .m-only { display: inline-flex; }
  .d-only { display: none; }
  #btnSheet { grid-column: 2; grid-row: 1; align-items: center; gap: 6px; }
  #btnSheet b { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 7px; font-size: 12px; font-variant-numeric: tabular-nums; }
  #btnExport { padding-inline: 10px; }
  .btn { padding: 7px 12px; }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  /* 底部抽屜 */
  .sheet {
    display: flex; flex-direction: column; gap: 12px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    max-height: 75vh; max-height: 75dvh; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.18);
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .22s ease; }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 12px 0 8px; font-weight: 700;
  }
  .search { max-width: none; }
  .search input { font-size: 16px; padding: 8px 14px; }
  .opts { gap: 10px 14px; font-size: 14px; }
  .opts .opt { font-size: 14px; }
  /* 抽屜內容不可被壓縮，超出時由抽屜本身捲動 */
  .sheet > * { flex-shrink: 0; }
  .tabs { padding-bottom: 4px; touch-action: pan-x pan-y; }
  .tab { padding: 6px 12px 6px 10px; font-size: 14px; }
  .items { max-height: none; overflow: visible; gap: 8px; }
  .pref-list { max-height: none; overflow: visible; gap: 6px; }
  .pchip { padding: 5px 11px; font-size: 13px; }
  .chip { padding: 7px 11px 7px 9px; font-size: 14px; }
  .groups form { margin-left: 0; width: 100%; }
  .groups input[type="text"] { flex: 1; padding: 6px 10px; font-size: 14px; }
  .map-wrap { min-height: 0; }
  .zoom button { width: 38px; height: 38px; }
  .note { font-size: 10px; bottom: 34px; }
  .quizbar { top: 8px; left: 8px; right: 54px; transform: none; max-width: none; border-radius: 12px; }
  .picker { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: auto; max-height: 55vh; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .sheet.open { transition: none; } }
</style>

<div class="panel" id="panel">
  <div class="head">
    <h1><span data-t="title"></span><small data-t="subtitle"></small></h1>
    <button class="btn m-only" id="btnSheet" type="button" aria-expanded="false" aria-controls="sheet"><span data-t="pick"></span> <b id="selCount">0</b></button>
    <button class="btn primary" id="btnExport" type="button"><span class="d-only" data-t="export"></span><span class="m-only" data-t="exportShort"></span></button>
    <button class="btn w-only" id="btnCollapse" type="button" data-t-aria="collapse" data-t-title="collapse">«</button>
  </div>
  <div class="sheet" id="sheet">
  <div class="sheet-head"><span data-t="pick"></span><button class="btn primary" id="btnSheetClose" type="button" data-t="done"></button></div>
  <div class="search" role="search">
    <input type="search" id="q" autocomplete="off" data-t-ph="searchPh" data-t-aria="searchPh" aria-controls="sugg" aria-autocomplete="list">
    <div class="sugg" id="sugg" role="listbox" hidden></div>
  </div>
  <div class="opts">
    <span class="seg" role="group" aria-label="言語 / 語言">
      <button type="button" id="langJa" lang="ja">日本語</button><button type="button" id="langZh" lang="zh-Hant">中文</button>
    </span>
    <span class="seg" role="group" data-t-aria="detailLabel">
      <button type="button" id="mSimple" data-t="simple"></button><button type="button" id="mDetail" data-t="detail"></button>
    </span>
    <span class="lv-group" id="reliefOpt" role="group" data-t-aria="relief">
      <label class="opt"><input type="checkbox" id="optRelief"> <span data-t="reliefColor"></span></label>
      <label class="opt"><input type="checkbox" id="optReliefGray"> <span data-t="reliefGray"></span></label>
    </span>
    <label class="opt slider" id="opacityOpt" hidden><span data-t="opacity"></span>
      <input type="range" id="opacity" min="0" max="100" step="5"> <b id="opacityVal"></b></label>
    <span class="lv-group" role="group" data-t-aria="levels">
      <label class="opt"><input type="checkbox" id="lvPri" checked> <span data-t="lv1"></span></label>
      <label class="opt"><input type="checkbox" id="lvExt" checked> <span data-t="lv2"></span></label>
      <label class="opt"><input type="checkbox" id="lvExt2" checked> <span data-t="lv3"></span></label>
    </span>
    <label class="opt"><input type="checkbox" id="optNames" checked> <span data-t="names"></span></label>
    <label class="opt" id="kanaOpt"><input type="checkbox" id="optKana" checked> <span data-t="kana"></span></label>
    <label class="opt"><input type="checkbox" id="optPref" checked> <span data-t="pref"></span></label>
    <button class="btn" id="btnClear" type="button" data-t="clear"></button>
  </div>
  <div class="actions">
    <button class="btn" id="btnBlank" type="button" data-t="actBlank"></button>
    <button class="btn" id="btnQuiz" type="button" data-t="actQuiz"></button>
    <button class="btn" id="btnShare" type="button" data-t="actShare" hidden></button>
  </div>
  <div class="tabs" id="tabs" role="tablist" data-t-aria="cats"></div>
  <div class="items-head">
    <span id="catTitle"></span>
    <button class="btn small" id="btnAll" type="button" data-t="all"></button>
    <button class="btn small" id="btnNone" type="button" data-t="none"></button>
  </div>
  <div class="items" id="items"></div>
  <div class="prefs" id="prefs">
    <span class="label" data-t="prefsTitle"></span>
    <div class="pref-list" id="prefList"></div>
  </div>
  <div class="groups" id="groups">
    <span class="label" data-t="groups"></span>
    <span id="groupList"></span>
    <form id="groupForm">
      <input type="text" id="groupName" maxlength="30" data-t-ph="groupName" data-t-aria="groupName">
      <button class="btn small" type="submit" data-t="saveGroup"></button>
    </form>
  </div>
  </div>
</div>

<div class="map-wrap" id="mapWrap">
  <div id="mapLayer"><svg id="map" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>
  <button class="btn" id="btnExpand" type="button" hidden data-t="expand"></button>
  <div class="zoom">
    <button type="button" id="zIn" data-t-aria="zoomIn">+</button>
    <button type="button" id="zOut" data-t-aria="zoomOut">−</button>
    <button type="button" id="zAll" class="fit" data-t="zoomAll"></button>
  </div>
  <div class="quizbar" id="quizBar" hidden>
    <span data-t="quizTitle"></span>
    <b id="quizStatus"></b>

  if (!l.leader) l.leader = leaderG.append("g").attr("class", "ldr");
  if (c.key === "c") { l.leader.attr("display", "none"); return; }
  const ax = transform.applyX(l.p[0]), ay = transform.applyY(l.p[1]), r = c.r;
  const ex = Math.max(r.x0, Math.min(ax, r.x1)), ey = Math.max(r.y0, Math.min(ay, r.y1));
  l.leader.attr("display", null).html(
    `<line x1="${ex}" y1="${ey}" x2="${ax}" y2="${ay}" stroke="#2b2622" stroke-width="1.3" stroke-opacity=".9"/>` +
    `<circle cx="${ax}" cy="${ay}" r="3" fill="#2b2622" stroke="#fff" stroke-width="1"/>`);
}

function placeLabels() {
  for (const c of currents) {
    c.el.attr("d", curve(c.pts.map((p) => transform.apply(p))));
    // 箭頭方向取線條最後 10px 的實際走向，避免曲線端點切線失準
    const n = c.el.node(), L = n.getTotalLength();
    const e = n.getPointAtLength(L), b = n.getPointAtLength(Math.max(0, L - 10));
    const a = Math.atan2(e.y - b.y, e.x - b.x), len = 14, hw = 7;
    const ux = Math.cos(a), uy = Math.sin(a);
    const tip = [e.x + ux * 4, e.y + uy * 4], base = [tip[0] - ux * len, tip[1] - uy * len];
    c.head.attr("d", `M${tip}L${base[0] - uy * hw},${base[1] + ux * hw}L${base[0] + uy * hw},${base[1] - ux * hw}Z`);
  }
  for (const l of labels) {
    const cs = candidates(l);
    moveLabel(l, cs.find((c) => c.key === l.key) || cs[0]);

}

// ---------- 勾選後自動縮放到該地形或該縣（一次勾很多個時不縮放） ----------
function zoomToGeom(geom, point) {
  if (!projection) return;
  let t;
  if (point) {
    const p = projection(point), k = Math.min(8, Math.max(transform.k, 4));
    t = d3.zoomIdentity.translate(W / 2 - k * p[0], H / 2 - k * p[1]).scale(k);
  } else {
    const [[x0, y0], [x1, y1]] = path.bounds(geom);
    if (!isFinite(x0)) return;
    const k = Math.max(0.6, Math.min(8, 0.8 * Math.min(W / Math.max(1, x1 - x0), H / Math.max(1, y1 - y0))));
    t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
  }
  zsel.transition().duration(600).call(zoom.transform, t);
}
function zoomToItem(it) {
  const g = geomOf(it);
  if (g) zoomToGeom(g); else if (it.c) zoomToGeom(null, it.c);
}

const GENERIC = new Set(["平野", "山地", "山脈", "高地", "高原", "盆地", "台地", "川", "河川", "湖", "湖沼", "湖泊", "半島", "岬", "岬角", "崎", "湾", "灣", "灘", "海峡", "海峽", "水道", "瀬戸", "瀨戶", "海", "島", "島嶼", "諸島", "列島", "山", "岳", "火山", "海流", "暖流", "寒流", "海溝", "海槽", "トラフ", "構造線",
  "へいや", "さんち", "さんみゃく", "こうち", "こうげん", "ぼんち", "だいち", "かわ", "がわ", "こ", "はんとう", "みさき", "わん", "なだ", "かいきょう", "すいどう", "しま", "じま", "とう", "やま", "さん", "ざん", "だけ", "たけ", "かざん", "かいりゅう", "かいこう"]);
let suggIdx = -1, suggItems = [];
function searchItems(q) {
  const s = q.trim();
  if (!s) return { list: [] };
  if (GENERIC.has(s) || GENERIC.has(toJa(s)) || GENERIC.has(toHira(s))) return { generic: true, list: [] };
  const sJa = toJa(s), sH = toHira(s);
  const scored = [];
  for (const it of ITEM_LIST) {
    const names = [it.n, it.zh];
    let sc = -1;
    for (const n of names) {
      if (n.startsWith(s) || n.startsWith(sJa)) sc = Math.max(sc, 3);
      else if (n.includes(s) || n.includes(sJa)) sc = Math.max(sc, 2);
    }
    if (sc < 0 && it.k && /^[ぁ-ゖー]+$/.test(sH)) {
      const k = it.k.replace(/、/g, "");
      if (k.startsWith(sH)) sc = 1.5; else if (k.includes(sH)) sc = 1;
    }
    if (sc >= 0) scored.push({ it, sc });
  }
  scored.sort((a, b) => b.sc - a.sc || a.it.n.length - b.it.n.length);
  return { list: scored.slice(0, 8).map((x) => x.it) };
}

    box.appendChild(m); box.hidden = false; return;

const downloadsP = cap("downloads");
const stamp = () => { const d = new Date(), pad = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
async function svgToBlob(node, w, h, scale = 2, type = "image/png") {
  const clone = node.cloneNode(true);
  clone.querySelectorAll("title").forEach((t) => t.remove());
  clone.querySelectorAll(".speaking").forEach((t) => t.classList.remove("speaking"));
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  const xml = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  await img.decode();
  const cv = document.createElement("canvas");
  cv.width = w * scale; cv.height = h * scale;
  const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, w, h);
  if (type === "image/jpeg") { ctx.globalCompositeOperation = "destination-over"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
  return new Promise((r) => cv.toBlob(r, type, 0.9));
}
// 交付檔案：一般網站直接下載；Claude 版走 downloads；都不行時顯示圖片讓使用者長按另存
async function deliver(files) {
  if (!window.claude) {
    for (const [blob, name] of files) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await new Promise((r) => setTimeout(r, 400));
    }
    return "downloaded";
  }
  const dl = await downloadsP;
  if (dl) {
    try { for (const [blob, name] of files) await dl.save({ filename: name, data: blob }); return "saved"; }
    catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return "declined"; }
  }
  showModal(T("saveHelp"), files.map(([b]) => URL.createObjectURL(b)));
  return "modal";
}

  $("modalMsg").textContent = msg;
  const box = $("modalImgs"); box.textContent = "";
  for (const u of imgs || []) { const im = document.createElement("img"); im.src = u; im.alt = ""; box.appendChild(im); }

// 解答清單：圓圈編號＋地名（日文版附讀音），在指定方框內自動分欄
function numBadge(sel, cx, cy, r, num, fs) {
  sel.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r).attr("fill", "#fff").attr("stroke", "#1e2a23").attr("stroke-width", 1.2);
  sel.append("text").attr("x", cx).attr("y", cy + fs * 0.32).attr("text-anchor", "middle")
    .attr("font-size", String(num).length > 2 ? fs * 0.62 : fs * 0.78).attr("font-weight", 700).text(num);
}
function drawKeyList(sel, list, x, y, w, h) {
  const n = list.length;
  let rowH = 24, fs = 13;
  let rows = Math.max(1, Math.floor(h / rowH)), cols = Math.ceil(n / rows);
  if (w / cols < 210) { rowH = 19; fs = 11; rows = Math.max(1, Math.floor(h / rowH)); cols = Math.ceil(n / rows); }
  rows = Math.ceil(n / cols);
  const colW = w / cols;
  list.forEach(({ n: num, it }, i) => {
    const c = Math.floor(i / rows), r = i % rows, cx = x + c * colW, cy = y + r * rowH, rr = fs * 0.72;
    numBadge(sel, cx + rr, cy + rr, rr, num, fs);
    const extra = state.lang === "ja" ? `（${readingOf(it)}）` : `（${it.n}）`;
    sel.append("text").attr("x", cx + rr * 2 + 6).attr("y", cy + rr + fs * 0.36).attr("font-size", fs).text(nameOf(it) + extra);
  });
}
// 作答欄：圓圈編號＋書寫線，列高足夠寫漢字與讀音
function drawWriteList(sel, list, x, y, w, h) {
  const n = list.length;
  let rowH = 34, fs = 12;
  let rows = Math.max(1, Math.floor(h / rowH)), cols = Math.ceil(n / rows);
  if (w / cols < 170) { rowH = 27; fs = 11; rows = Math.max(1, Math.floor(h / rowH)); cols = Math.ceil(n / rows); }
  rows = Math.ceil(n / cols);
  const colW = w / cols;
  list.forEach(({ n: num }, i) => {
    const c = Math.floor(i / rows), r = i % rows, cx = x + c * colW, cy = y + r * rowH, rr = fs * 0.75;
    numBadge(sel, cx + rr, cy + rowH - rr - 6, rr, num, fs);
    sel.append("line").attr("x1", cx + rr * 2 + 6).attr("x2", cx + colW - 12).attr("y1", cy + rowH - 5).attr("y2", cy + rowH - 5)
      .attr("stroke", "#444").attr("stroke-width", 0.8);
  });
}
function newSvg(w, h) {

//  B＝3 張 PNG：地圖、作答欄、解答

    const mapH = portrait ? Math.round((h - top - foot - m) * 0.62) : h - top - foot;
    const map = renderOffscreenMap(mapW, mapH);

    if (tag) g.append("text").attr("x", x + pw / 2).attr("y", y + ph + 10).attr("text-anchor", "middle").attr("font-size", 7.5).attr("fill", "currentColor").text(tag);
  };

}
// 起伏圖開關：開啟時才顯示地形不透明度滑桿
// 彩色／灰階起伏圖互斥：勾其中一個會取消另一個
for (const [id, v] of [["optRelief", "color"], ["optReliefGray", "gray"]])
  $(id).onchange = (e) => { state.relief = e.target.checked ? v : ""; persist(); applyLang(); drawFeatures(); };
$("opacity").oninput = (e) => { state.opacity = +e.target.value; $("opacityVal").textContent = state.opacity + "%"; applyOpacity(); };
$("opacity").onchange = () => persist();
for (const [id, L] of [["langJa", "ja"], ["langZh", "zh"]]) {
  $(id).onclick = () => { if (state.lang === L) return; state.lang = L; persist(); applyLang(); renderGroups(); renderPrefs(); changed(); };
}
setCollapsed(LS.get("collapsed", false) === true);
applyLang(); renderTabs(); renderItems(); renderPrefs(); renderGroups();
document.fonts && document.fonts.ready.then(() => { if (lastSize) drawFeatures(); });
</script>
